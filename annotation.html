<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Annotator UI</title>
    <style>
        :root {
            --bg-dark: #1e1e1e;
            --panel-bg: #2d2d2d;
            --accent: #007acc;
            --text: #e1e1e1;
            --border: #444;
        }

        body {
            margin: 0;
            background: var(--bg-dark);
            color: var(--text);
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* --- Header --- */
        header {
            height: 50px;
            background: var(--panel-bg);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            border-bottom: 1px solid var(--border);
        }

        /* --- Main Body --- */
        main {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* --- Left Toolbar --- */
        #toolbar {
            width: 60px;
            background: var(--panel-bg);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 10px 0;
            align-items: center;
        }

        .tool-icon {
            width: 40px;
            height: 40px;
            background: #3c3c3c;
            border: 1px solid var(--border);
            color: white;
            cursor: pointer;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .tool-icon.active {
            background: var(--accent);
            border-color: #4fb1ff;
        }

        /* --- Workspace (Canvas Area) --- */
        #workspace {
            flex: 1;
            position: relative;
            overflow: auto; /* For scrollbars when zoomed */
            display: flex;
            align-items: center;
            justify-content: center;
            background-image: radial-gradient(#333 1px, transparent 1px);
            background-size: 20px 20px; /* Grid background */
        }

        #canvas-container {
            position: relative;
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
        }

        canvas {
            display: block;
            cursor: crosshair;
        }

        /* --- Right Sidebar --- */
        #sidebar {
            width: 280px;
            background: var(--panel-bg);
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 15px;
            font-weight: bold;
            border-bottom: 1px solid var(--border);
            background: #383838;
        }

        #object-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .object-card {
            background: #3c3c3c;
            margin-bottom: 8px;
            padding: 10px;
            border-radius: 4px;
            font-size: 13px;
            border-left: 4px solid var(--accent);
        }
    </style>
</head>
<body>

    <header>
        <div><strong>Project:</strong> Road_Safety_Test_01</div>
        <div id="status" style="color: #00ff00;">● System Ready</div>
        <button style="background: var(--accent); color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer;">Export JSON</button>
    </header>

    <main>
        <div id="toolbar">
            <div class="tool-icon active" title="Draw Rectangle (N)">Rect</div>
            <div class="tool-icon" title="Pan (Hold Space)">Pan</div>
            <div class="tool-icon" title="Zoom (Wheel)">🔍</div>
            <hr style="width: 80%; border-color: #555;">
            <input type="file" id="fileInput" style="display: none;">
            <div class="tool-icon" onclick="document.getElementById('fileInput').click()" title="Upload Image">📁</div>
        </div>

        <div id="workspace">
            <div id="canvas-container">
                <canvas id="mainCanvas"></canvas>
            </div>
        </div>

        <div id="sidebar">
            <div class="sidebar-header">Objects (0)</div>
            <div id="object-list">
                <div class="object-card">No annotations yet.</div>
            </div>
        </div>
    </main>

</body>
</html>
